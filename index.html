<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenithLiteAura</title>
<meta name="description" content="ZenithLiteAura 的个人主页：主要写 Python，闲下来都在折腾；能自建的就自建。">
<meta name="theme-color" id="metaColor" content="#F5F1E9">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
/* 首屏前先落主题，避免闪烁 */
(function(){try{var t=localStorage.getItem('zla:home-theme');
if(t!=='light'&&t!=='dark'&&t!=='term'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}})();
</script>
<style>
/* ============ 主题变量：纸 / 暮 / 磷光 ============ */
:root{
  --bg:#F5F1E9; --bg-2:#FCFAF4; --bg-3:#EBE5D8;
  --ink:#221E18; --ink-2:#6E6759;
  --line:#E0D8C8; --line-2:#CDC2AB;
  --accent:#C14A11; --accent-ink:#FCFAF4;
  --code-bg:#1B1712; --code-line:#332C22; --code-meta:#8B8171; --code-ink:#EAE2D2;
  --shadow-raise:0 22px 44px -20px rgba(48,38,26,.30);
  --tok-kw:#E8873F; --tok-str:#A6BE72; --tok-num:#D9A967;
  --tok-com:#847B69; --tok-fn:#F1E9DA; --tok-var:#E0C08A;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#171310; --bg-2:#1F1A15; --bg-3:#120E0A;
  --ink:#EDE5D6; --ink-2:#9C9282;
  --line:#2E2820; --line-2:#443A2C;
  --accent:#E8752F; --accent-ink:#1C130B;
  --code-bg:#100C08; --code-line:#2B241B; --code-meta:#786F5E; --code-ink:#E9E0CF;
  --shadow-raise:0 26px 50px -22px rgba(0,0,0,.60);
  --tok-kw:#F09049; --tok-str:#B3CC7E; --tok-num:#E0B26E;
  --tok-com:#6E675A; --tok-fn:#F5EDDB; --tok-var:#E2C28C;
  color-scheme:dark;
}
[data-theme="term"]{
  --bg:#060B07; --bg-2:#0B130D; --bg-3:#040806;
  --ink:#A5EFAC; --ink-2:#5EA96B;
  --line:#173321; --line-2:#275C37;
  --accent:#42F581; --accent-ink:#04160B;
  --code-bg:#030805; --code-line:#173321; --code-meta:#4E8A5C; --code-ink:#C7FFD1;
  --shadow-raise:0 26px 50px -22px rgba(0,0,0,.80);
  --tok-kw:#46E881; --tok-str:#8FE39B; --tok-num:#C2FFCF;
  --tok-com:#3E7048; --tok-fn:#DDFFE2; --tok-var:#6FDD87;
  color-scheme:dark;
}
/* 磷光主题：CRT 扫描线纹理 */
[data-theme="term"] body::after{
  content:""; position:fixed; inset:0; z-index:3000; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
}
/* 主题切换时的全局色彩过渡（只在切换窗口期生效，避免干扰悬停动画） */
html.theme-xing, html.theme-xing *, html.theme-xing *::before, html.theme-xing *::after{
  transition: background-color .45s ease, color .45s ease, border-color .45s ease,
    box-shadow .45s ease, fill .45s ease, stroke .45s ease,
    transform .45s cubic-bezier(.3,1.3,.4,1);
}

/* ============ 基础 ============ */
*{ margin:0; padding:0; box-sizing:border-box }
html{ scroll-behavior:smooth }
body{
  font-family:'Newsreader','Iowan Old Style',Georgia,serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-optical-sizing:auto;
}
.mono{ font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace }
.accent{ color:var(--accent) }
a{ color:inherit; text-decoration:none }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer }
svg{ flex:none }
::selection{ background:var(--accent); color:var(--accent-ink) }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:3px }
.wrap{ width:100%; max-width:none; margin-inline:0; padding-inline:clamp(20px,5vw,96px) }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }
#posts,#snippets,#oss,#about{ scroll-margin-top:4.5rem }
.sec{ margin-top:clamp(5rem,13vh,8.5rem) }

/* ============ 顶部阅读进度条 ============ */
.progress{ position:fixed; top:0; left:0; right:0; height:3px; z-index:1100; pointer-events:none }
.progress-bar{ height:100%; width:100%; background:var(--accent); transform:scaleX(0); transform-origin:0 50% }
.progress-cursor{
  position:absolute; top:-2px; left:0; width:4px; height:7px;
  background:var(--accent); opacity:0; transition:opacity .2s;
}

/* ============ 导航 ============ */
.nav{ position:sticky; top:0; z-index:900; background:var(--bg) }
.nav.scrolled{ box-shadow:0 1px 0 var(--line) }
@supports (backdrop-filter:blur(4px)){
  .nav.scrolled{ background:color-mix(in srgb,var(--bg) 78%,transparent); backdrop-filter:blur(10px) }
}
.nav-inner{ display:flex; align-items:center; gap:2rem; height:62px }
.logo{ font-size:.92rem; letter-spacing:-.02em; cursor:pointer }
.logo-p{ color:var(--accent) }
.nav-links{ display:flex; gap:1.6rem; font-size:.82rem }
.nav-links a{ color:var(--ink-2); padding-bottom:2px; border-bottom:1px solid transparent; transition:color .25s,border-color .25s }
.nav-links a:hover{ color:var(--ink); border-color:var(--accent) }
.nav-right{ margin-left:auto; display:flex; align-items:center; gap:.9rem }
.gh-link{ color:var(--ink-2); display:grid; place-items:center; transition:color .25s }
.gh-link:hover{ color:var(--ink) }
.gh-link svg{ width:19px; height:19px }

/* 三态主题切换 */
.tt{ position:relative; display:flex; padding:3px; border:1px solid var(--line); border-radius:999px; background:var(--bg-2) }
.tt-thumb{
  position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px)/3);
  background:var(--ink); border-radius:999px;
  transition:transform .35s cubic-bezier(.3,1.3,.4,1);
}
.tt-btn{ position:relative; z-index:1; width:36px; height:28px; display:grid; place-items:center; border-radius:999px; color:var(--ink-2); transition:color .3s }
.tt-btn svg{ width:15px; height:15px }
.tt-btn.on{ color:var(--bg) }
/* 语言开关：和主题切换同一视觉语言，但单独用 .lg-btn，避免干扰主题滑块的索引计算 */
.lang-sw{ position:relative; display:flex; padding:3px; border:1px solid var(--line); border-radius:999px; background:var(--bg-2) }
.lg-btn{ width:34px; height:28px; display:grid; place-items:center; border-radius:999px; font-size:.7rem; font-weight:600; letter-spacing:.02em; color:var(--ink-2); transition:color .3s, background-color .3s }
.lg-btn[aria-pressed="true"]{ color:var(--bg); background:var(--ink) }

/* ============ Hero ============ */
.hero{ padding-top:clamp(4.5rem,11vh,7.5rem) }
.overline{ color:var(--accent); font-size:.78rem; letter-spacing:.14em }
.tw-cmd{ margin-top:2.7rem; font-size:.85rem; color:var(--ink-2) }
/* 主标题已交给点阵 canvas，这里降为一行副标题（名句打字机） */
.tw-line{
  margin-top:1.1rem; min-height:3.2em; cursor:pointer;
  font-size:clamp(1.05rem,2.4vw,1.45rem); font-weight:400;
  line-height:1.5; letter-spacing:.01em; color:var(--ink-2);
}
.tw-cursor{
  display:inline-block; width:.5em; height:.95em; margin-left:.1em;
  background:var(--accent); vertical-align:-.08em;
  animation:blink 1.1s step-end infinite;
}
.tw-line.is-typing .tw-cursor{ animation:none }
/* 打出处时光标跟小字一起缩一号 */
.tw-line.is-attr .tw-cursor{ width:.34em; height:.62em; vertical-align:-.02em }
/* 名句出处：打完字后淡入，字号略小、颜色更淡 */
.tw-attr{
  display:inline-block; margin-left:.45em; font-size:.62em; letter-spacing:.02em;
  color:var(--ink-3, #948B7C); opacity:0;
  transition:opacity .18s ease;
}
.tw-attr.is-on{ opacity:1 }
@keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
.lede{ margin-top:1.7rem; max-width:60ch; font-size:1.13rem; color:var(--ink-2) }
.hero-meta{ margin-top:2.4rem; font-size:.78rem; color:var(--ink-2) }
.hero-meta b{ color:var(--accent); font-weight:500 }

/* 项目官网入口 */
.site-list{ margin-top:1.5rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px }
.site-card{
  display:flex; flex-direction:column; gap:.35rem; padding:.9rem 1rem;
  border:1px solid var(--line); border-radius:4px; background:var(--bg-2);
  text-decoration:none; color:var(--ink); transition:border-color .18s ease;
}
.site-card:hover{ border-color:var(--accent) }
.site-card__name{ font-size:1rem; font-weight:500 }
.site-card__tag{ font-size:.72rem; color:var(--ink-2); line-height:1.6 }

/* git log 跑马灯 */
.ticker{ margin-top:4.5rem; border-block:1px solid var(--line); overflow:hidden; padding:.75rem 0; user-select:none }
.ticker-inner{ display:flex; width:max-content; animation:tickmove 34s linear infinite }
.ticker:hover .ticker-inner{ animation-play-state:paused }
.log{ margin-right:3.5rem; font-size:.78rem; color:var(--ink-2); white-space:nowrap }
.log b{ color:var(--accent); font-weight:500; margin-right:.6rem }
@keyframes tickmove{ to{ transform:translateX(-50%) } }

/* ============ 章节标题 ============ */
.sec-head{ display:flex; align-items:baseline; gap:1.1rem }
.sec-head .idx{ color:var(--accent); font-size:.8rem }
.sec-head h2{ font-size:clamp(1.5rem,3vw,1.9rem); font-weight:600; letter-spacing:-.01em }
.sec-head .rule{ flex:1; height:1px; background:var(--line); align-self:center }
.sec-sub{ margin-top:.9rem; max-width:62ch; color:var(--ink-2); font-size:1.02rem }

/* ============ 文章卡片 ============ */
.post-list{ margin-top:2.8rem; display:flex; flex-direction:column; gap:2.6rem }
.posts-grid{ display:grid; grid-template-columns:1fr 1fr; gap:2.2rem; text-align:left }
.posts-grid > .reveal:nth-child(even){ margin-top:3.2rem }
.card{
  position:relative; display:flex; flex-direction:column; gap:.95rem;
  background:var(--bg-2); border:1px solid var(--line); border-radius:10px;
  padding:1.7rem 1.7rem 1.5rem; cursor:pointer; text-align:left;
  transition:transform .32s cubic-bezier(.2,.7,.2,1), box-shadow .32s, border-color .32s;
}
.card:hover, .card:focus-visible{
  transform:translateY(-6px); border-color:var(--line-2); box-shadow:var(--shadow-raise);
}
.card h3{ font-weight:560; line-height:1.25; font-size:1.35rem }
.card-ex{ color:var(--ink-2); font-size:.99rem }
.card-top{ display:flex; justify-content:space-between; font-size:.72rem; color:var(--ink-2) }
.card-idx{ transition:color .3s }
.card:hover .card-idx{ color:var(--accent) }
.card-tags{ font-size:.72rem; color:var(--accent); letter-spacing:.04em }
.posts-grid .card > .card-tags{ margin-top:auto }
.card-arrow{
  position:absolute; top:1.15rem; right:1.15rem; color:var(--accent);
  opacity:0; transform:translate(-6px,6px); transition:opacity .3s, transform .3s;
}
.card-arrow svg{ width:16px; height:16px }
.card:hover .card-arrow{ opacity:1; transform:none }

.card-featured{ display:grid; grid-template-columns:1.05fr .95fr; gap:2.2rem; padding:2.1rem }
.cf-text{ display:flex; flex-direction:column; gap:1rem; min-width:0 }
.cf-title{ font-size:clamp(1.6rem,3vw,2.15rem); font-weight:560; line-height:1.18 }
.cf-ex{ color:var(--ink-2); max-width:56ch }
.card-meta{ display:flex; align-items:center; gap:1.1rem; margin-top:auto; font-size:.74rem; color:var(--ink-2) }
.read-cta{ margin-left:auto; color:var(--accent); display:inline-flex; align-items:center; gap:.45rem }
.read-cta svg{ width:12px; height:12px; transition:transform .3s }
.card:hover .read-cta svg{ transform:translate(3px,-3px) }
.cf-code{ min-width:0; display:flex; flex-direction:column; justify-content:center }
.cf-code pre code{ font-size:.8rem }

/* ============ 代码块 ============ */
.codeblock{ border:1px solid var(--code-line); border-radius:10px; overflow:hidden; background:var(--code-bg) }
.cb-head{ display:flex; align-items:center; gap:.75rem; padding:.55rem .6rem .55rem 1rem; border-bottom:1px solid var(--code-line) }
.cb-name{ font-size:.74rem; color:var(--code-meta) }
.cb-lang{ font-size:.64rem; color:var(--code-meta); border:1px solid var(--code-line); border-radius:999px; padding:.12rem .5rem }
.cb-head .copy-btn{ margin-left:auto }
.codeblock pre{ margin:0; padding:1.05rem 1.15rem; overflow-x:auto; scrollbar-width:thin; scrollbar-color:var(--code-line) transparent }
.codeblock pre::-webkit-scrollbar{ height:8px }
.codeblock pre::-webkit-scrollbar-thumb{ background:var(--code-line); border-radius:4px }
.codeblock code{
  display:block; white-space:pre; color:var(--code-ink);
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:.84rem; line-height:1.7;
  font-variant-ligatures:none;
}
.tk-com{ color:var(--tok-com); font-style:italic }
.tk-kw{ color:var(--tok-kw); font-weight:600 }
.tk-str{ color:var(--tok-str) }
.tk-num{ color:var(--tok-num) }
.tk-fn{ color:var(--tok-fn); font-weight:500 }
.tk-type{ color:var(--tok-fn); font-style:italic }
.tk-var{ color:var(--tok-var) }

/* 复制按钮：命中后闪一下 */
.copy-btn{
  display:inline-flex; align-items:center; gap:.42rem; font-size:.72rem;
  padding:.34rem .62rem; border:1px solid var(--code-line); border-radius:6px;
  color:var(--code-meta); transition:color .25s, border-color .25s, background .25s;
}
.copy-btn:hover{ color:var(--code-ink); border-color:var(--code-meta) }
.copy-btn .ic{ display:inline-flex; align-items:center }
.copy-btn .ic svg{ width:13px; height:13px }
.copy-btn .ic-check, .copy-btn .lbl-done, .copy-btn .lbl-fail{ display:none }
.copy-btn.copied{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.copy-btn.copied .ic-copy{ display:none }
.copy-btn.copied .ic-check{ display:inline-flex }
.copy-btn.copied .lbl-copy{ display:none }
.copy-btn.copied .lbl-done{ display:inline }
.copy-btn.failed{ border-color:var(--accent); color:var(--accent) }
.copy-btn.failed .lbl-copy{ display:none }
.copy-btn.failed .lbl-fail{ display:inline }
/* 整块代码闪一圈描边 */
.codeblock.flashed{ animation:blockflash .9s ease-out }
@keyframes blockflash{
  0%{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);
      background:color-mix(in srgb,var(--accent) 9%,var(--code-bg)) }
  100%{ border-color:var(--code-line); box-shadow:0 0 0 1px transparent; background:var(--code-bg) }
}

/* ============ Snippets 标签页 ============ */
.snippet-tabs{ display:flex; gap:.5rem; margin-top:2.4rem; flex-wrap:wrap }
.tab-btn{
  font-size:.78rem; padding:.5rem .95rem; border:1px solid var(--line);
  border-radius:999px; color:var(--ink-2); transition:.25s;
}
.tab-btn:hover{ color:var(--ink); border-color:var(--line-2) }
.tab-btn.on{ background:var(--ink); color:var(--bg); border-color:var(--ink) }
#snippetView{ margin-top:1rem }
#snippetView.swap{ animation:swapin .28s ease }
@keyframes swapin{ from{ opacity:0; transform:translateY(10px) } }

/* ============ Open Source ============ */
.oss-status{ margin-top:1.5rem; display:flex; align-items:center; gap:.6rem; font-size:.74rem; color:var(--ink-2) }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); animation:dotpulse 2.2s ease-in-out infinite; flex:none }
@keyframes dotpulse{ 0%,100%{opacity:1} 50%{opacity:.3} }
.oss-status.offline .dot{ background:var(--ink-2); animation:none }
.oss-list{ margin-top:.9rem }
.repo{
  display:flex; justify-content:space-between; align-items:center; gap:1.5rem;
  padding:1.25rem .9rem; border-bottom:1px solid var(--line);
  transition:background .25s;
}
.repo:first-child{ border-top:1px solid var(--line) }
.repo:hover{ background:color-mix(in srgb,var(--accent) 4%,transparent) }
.repo-id{ min-width:0 }
.repo-name{ font-size:.95rem; display:inline-flex; align-items:center }
.repo-arrow{ display:inline-flex; margin-left:.5rem; opacity:.45; color:var(--ink-2); transition:.25s }
.repo-arrow svg{ width:12px; height:12px }
.repo:hover .repo-name{ color:var(--accent) }
.repo:hover .repo-arrow{ opacity:1; color:var(--accent); transform:translate(2px,-2px) }
.repo-desc{ display:block; margin-top:.25rem; font-size:.95rem; color:var(--ink-2); max-width:52ch }
.repo-stats{ display:flex; align-items:center; gap:1.4rem; font-size:.8rem; color:var(--ink-2); white-space:nowrap; margin-left:auto }
.stat{ display:inline-flex; align-items:center; gap:.45rem }
.stat svg{ width:14px; height:14px }
.stat b{ color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums }
.repo-lang{ border:1px solid var(--line); border-radius:999px; padding:.2rem .6rem; font-size:.66rem }

/* ============ 页脚 ============ */
.footer{ margin-top:clamp(5rem,13vh,8.5rem); border-top:1px solid var(--line); padding-top:3.2rem; padding-bottom:4rem }
.about-txt{ margin-top:1.2rem; max-width:64ch; font-size:1.06rem; color:var(--ink-2) }
.inline-code{
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:.82em;
  background:var(--bg-3); border:1px solid var(--line); border-radius:5px; padding:.14em .42em;
}
.mail-copy{ transition:color .25s, border-color .25s }
.mail-copy:hover{ color:var(--accent); border-color:var(--accent) }
.colo{ margin-top:2.5rem; display:flex; flex-wrap:wrap; gap:1rem 2rem; color:var(--ink-2); font-size:.73rem }
.sys-clock b{ color:var(--accent); font-weight:500 }
.eof{ margin-top:3.2rem; text-align:center; letter-spacing:.35em; color:var(--ink-2); font-size:.72rem }
.copyright{ margin-top:1.8rem; color:var(--ink-2); font-size:.7rem }

/* ============ 文章阅读层 ============ */
.reader{
  position:fixed; inset:0; z-index:1000; background:var(--bg);
  display:flex; flex-direction:column;
  opacity:0; transform:translateY(20px);
  transition:opacity .32s ease, transform .32s ease;
}
.reader[hidden]{ display:none }
.reader.open{ opacity:1; transform:none }
.reader-top{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:1rem;
  padding:.8rem clamp(20px,4.5vw,44px); border-bottom:1px solid var(--line); background:var(--bg);
}
@supports (backdrop-filter:blur(2px)){
  .reader-top{ background:color-mix(in srgb,var(--bg) 80%,transparent); backdrop-filter:blur(10px) }
}
.close-btn{
  display:inline-flex; align-items:center; gap:.55rem; font-size:.78rem; color:var(--ink-2);
  border:1px solid var(--line); padding:.45rem .85rem; border-radius:999px; transition:.25s;
}
.close-btn:hover{ color:var(--accent); border-color:var(--accent) }
.close-btn svg{ width:13px; height:13px }
.reader-path{ margin-left:auto; color:var(--ink-2); font-size:.7rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.reader-scroll{ flex:1; overflow-y:auto; overscroll-behavior:contain }
.reader-inner{ max-width:720px; margin:0 auto; padding:clamp(3rem,7vh,4.5rem) 1.5rem 6rem }
.reader-inner h1{ margin-top:.85rem; font-size:clamp(1.9rem,4.5vw,2.7rem); font-weight:560; line-height:1.18; letter-spacing:-.015em }
.r-meta{ margin-top:1rem; font-size:.74rem; color:var(--ink-2) }
.reader-body p{ margin-top:1.35rem; font-size:1.09rem; line-height:1.78 }
.reader-body .codeblock{ margin-top:1.7rem }
.reader-body blockquote{
  margin:2rem 0 0; padding-left:1.4rem; border-left:3px solid var(--accent);
  font-style:italic; font-size:1.22rem; line-height:1.6;
}
.reader-next{ margin-top:3.5rem; border-top:1px solid var(--line); padding-top:1.5rem; cursor:pointer; display:flex; flex-direction:column; gap:.4rem }
.rn-label{ font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; color:var(--accent) }
.reader-next strong{ display:flex; align-items:center; gap:.6rem; font-size:1.28rem; font-weight:560; line-height:1.3 }
.rn-arrow{ display:inline-flex; color:var(--accent) }
.rn-arrow svg{ width:15px; height:15px }
.reader-next:hover strong{ color:var(--accent) }

/* ============ CRT 开机扫线 ============ */
.crt-sweep{ position:fixed; inset:0; z-index:1300; pointer-events:none; background:rgba(0,0,0,.45); animation:crt-fade .55s ease-out forwards }
.crt-sweep .sweep-line{ position:absolute; left:0; right:0; top:-2px; height:2px; background:var(--accent); animation:crt-down .55s cubic-bezier(.25,.6,.3,1) forwards }
@keyframes crt-down{ to{ transform:translateY(102vh) } }
@keyframes crt-fade{ 60%{opacity:1} 100%{opacity:0} }

/* ============ 滚动浮现 ============ */
.reveal{ opacity:0; transform:translateY(22px); transition:opacity .65s ease, transform .65s cubic-bezier(.2,.7,.2,1); transition-delay:var(--d,0s) }
.reveal.in{ opacity:1; transform:none }

/* ============ 响应式 ============ */
@media (max-width:920px){
  .card-featured{ grid-template-columns:1fr; gap:1.6rem }
  .repo{ flex-direction:column; align-items:flex-start; gap:.8rem }
  .repo-stats{ margin-left:0 }
}
@media (max-width:680px){
  .nav-links{ display:none }
  .posts-grid{ grid-template-columns:1fr }
  .posts-grid > .reveal:nth-child(even){ margin-top:0 }
  .repo-stats{ flex-wrap:wrap; gap:.8rem 1.2rem }
  .tw-line{ min-height:3.5em }
}
@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto }
  .ticker-inner{ animation:none }
  .reveal{ opacity:1; transform:none; transition:none }
  .dot{ animation:none }
  .tw-cursor{ animation:none }
}

/* ---------- 迷你语法高亮（手写扫描器） ---------- */
const KW = {
  ts:   'const let var function return if else for while do switch case break continue new typeof instanceof void delete in of class extends super this null undefined true false export import from default async await yield try catch finally throw as type interface enum implements readonly public private static get set string number boolean any unknown never object',
  js:   'const let var function return if else for while do switch case break continue new typeof instanceof void delete in of class extends super this null undefined true false async await yield try catch finally throw',
  bash: 'if then else elif fi for while until do done case esac in function return export local set unset echo cd exit read shift trap source printf',
  sql:  'select from where and or not null as on join left right inner outer group by order having limit offset insert into values update delete set create table view index with union all distinct case when then end between like in is asc desc exists',
  c:    'if else for while do switch case default break continue return struct union enum typedef static extern const volatile unsigned signed void int long short char float double size_t define include ifdef ifndef endif pragma',
};
const KWSET = {}; for (const k in KW) KWSET[k] = new Set(KW[k].split(' '));
const CMT = { ts:'//', js:'//', c:'//', bash:'#', sql:'--' };

function highlight(code, lang){
  const kws = KWSET[lang] || new Set();
  const cm  = CMT[lang] || '//';
  const out = [];
  const push = (cls, text) => { if(!text) return; out.push(cls ? `<span class="tk-${cls}">${esc(text)}</span>` : esc(text)); };
  let i = 0;
  while (i < code.length){
    const ch = code[i];
    const before = i === 0 ? '\n' : code[i-1];
    /* 块注释 */
    if (code.startsWith('/*', i)){
      let j = code.indexOf('*/', i+2); j = j < 0 ? code.length : j+2;
      push('com', code.slice(i, j)); i = j; continue;
    }
    /* 行注释（要求前面是空白或行首，避免误吞 --、# 等） */
    if (code.startsWith(cm, i) && (before === '\n' || /\s/.test(before))){
      let j = code.indexOf('\n', i); j = j < 0 ? code.length : j;
      push('com', code.slice(i, j)); i = j; continue;
    }
    /* 字符串 */
    if (ch === '"' || ch === "'" || ch === '`'){
      let j = i+1;
      while (j < code.length && code[j] !== ch && code[j] !== '\n'){ if (code[j] === '\\') j++; j++; }
      push('str', code.slice(i, Math.min(j+1, code.length))); i = j+1; continue;
    }
    /* 数字 */
    if (/[0-9]/.test(ch) && !/[\w$]/.test(before)){
      let j = i; while (j < code.length && /[\w.]/.test(code[j])) j++;
      push('num', code.slice(i, j)); i = j; continue;
    }
    /* bash 变量 */
    if (lang === 'bash' && ch === '$' && /[A-Za-z_{]/.test(code[i+1] || '')){
      let j = i+1; while (j < code.length && /[\w{}]/.test(code[j])) j++;
      push('var', code.slice(i, j)); i = j; continue;
    }
    /* C 预处理 */
    if (lang === 'c' && ch === '#'){
      let j = i+1; while (j < code.length && /[a-z]/.test(code[j])) j++;
      push('kw', code.slice(i, j)); i = j; continue;
    }
    /* 标识符：关键字 / 函数 / 类型 */
    if (/[A-Za-z_$]/.test(ch)){
      let j = i; while (j < code.length && /[\w$]/.test(code[j])) j++;
      const word = code.slice(i, j);
      let k = j; while (k < code.length && /\s/.test(code[k])) k++;
      if (kws.has(word.toLowerCase())) push('kw', word);
      else if (code[k] === '(') push('fn', word);
      else if (/^[A-Z]/.test(word)) push('type', word);
      else push('', word);
      i = j; continue;
    }
    push('', ch); i++;
  }
  return out.join('');
}

/* ---------- 正文格式化：`code` 与 *emphasis* ---------- */
function prose(text){
  return esc(text)
    .replace(/`([^`]+)`/g, (_, c) => `<code class="inline-code">${c}</code>`)
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

/* ---------- 复制：剪贴板 + 降级 + 闪烁反馈 ---------- */
async function copyText(text){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; }
  } catch(_){}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch(_){ return false; }
}
document.addEventListener('click', async e => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const block = btn.closest('.codeblock');
  const text = block ? block.querySelector('code').textContent : '';
  const ok = await copyText(text);
  btn.classList.remove('copied','failed');
  if (block) block.classList.remove('flashed');
  void btn.offsetWidth; /* 重置动画 */
  btn.classList.add(ok ? 'copied' : 'failed');
  if (ok && block) block.classList.add('flashed');
  clearTimeout(btn._t);
  btn._t = setTimeout(() => {
    btn.classList.remove('copied','failed');
    if (block) block.classList.remove('flashed');
  }, 1500);
});

function animateNum(el, target){
  if (REDUCED){ el.textContent = fmt(target); return; }
  const t0 = performance.now(), dur = 1100;
  const step = t => {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(target * e));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  const t = L10N[LANG];

    ? t['oss.live'].replace('{n}', REPOS.length).replace('{ms}', ossStat.ms)
    : ossStat.kind === 'partial'
      ? t['oss.partial'].replace('{ok}', ossStat.ok).replace('{n}', REPOS.length)
      : ossStat.kind === 'offline' ? t['oss.offline'] : t['oss.querying'];
  st.innerHTML = `<span class="dot"></span> ${txt}`;
  st.classList.toggle('offline', ossStat.kind === 'offline');
}

(async function loadOSS(){
  const t0 = performance.now();
  const rs = await Promise.all(REPOS.map(async r => {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 6000);
    try {
      const res = await fetch('https://api.github.com/repos/' + r.slug,
        { signal: ctrl.signal, headers: { Accept:'application/vnd.github+json' } });
      if (!res.ok) throw new Error('http ' + res.status);
      const d = await res.json();
      return { ok:true, stars: d.stargazers_count|0, forks: d.forks_count|0, desc: d.description || '' };
    } catch(_){ return { ok:false }; }
    finally { clearTimeout(to); }
  }));
  const ms = Math.max(1, Math.round(performance.now() - t0));
  const okN = rs.filter(r => r.ok).length;
  ossData = rs; tryFillOSS();
  ossStat = okN === REPOS.length
    ? { kind: 'live', ms }
    : (okN > 0 ? { kind: 'partial', ok: okN, ms } : { kind: 'offline', ms });
  renderOssStatus();
})();

const PHRASES = [
  '你好，我是 ZenithLiteAura。',
  '路漫漫其修远兮，吾将上下而求索。|||——屈原《离骚》',
];
const twText = $('#twText'), twLine = $('#twLine'), twAttr = $('#twAttr');
let pi = 0, ci = 0, del = false, twTimer = null;

// 一条文案的格式：正文|||——作者《篇名》（作者可省略）
function splitPhrase(s){
  const i = String(s).indexOf('|||');
  return i < 0 ? { q: String(s), a: '' } : { q: String(s).slice(0, i), a: String(s).slice(i + 3) };
}
// 把「已打出的字数」映射到正文与出处两段上：出处接在正文后面继续打
function renderTyped(q, a2, n){
  twText.textContent = q.slice(0, Math.min(n, q.length));
  const an = Math.max(0, n - q.length);
  twAttr.textContent = an > 0 ? a2.slice(0, an) : '';
  twAttr.classList.toggle('is-on', an > 0);
  twLine.classList.toggle('is-attr', an > 0);
}
function twStep(){
  const { q, a: at } = splitPhrase(PHRASES[pi]);
  const total = q.length + at.length;
  if (!del){
    ci++;
    renderTyped(q, at, ci);
    twLine.classList.add('is-typing');
    if (ci >= total){
      twLine.classList.remove('is-typing');
      twTimer = setTimeout(() => { del = true; twStep(); }, 4200);
      return;
    }
    const inAttr = ci > q.length;
    const ch = inAttr ? at[ci - q.length - 1] : q[ci - 1];
    let d = /[,.;:!?—，。；：！？、]/.test(ch) ? 240 : (ch === ' ' ? 55 : 36 + Math.random()*60);
    if (ci === q.length + 1) d += 220;        // 正文与出处之间停顿一下
    if (inAttr) d = Math.max(26, Math.round(d * 0.55));  // 出处打得快一点
    twTimer = setTimeout(twStep, d);
  } else {
    ci -= 4;
    if (ci <= 0){
      ci = 0; del = false;
      twLine.classList.remove('is-typing');
      renderTyped(q, at, 0);
      pi = (pi + 1) % PHRASES.length;
      twTimer = setTimeout(twStep, 380);
      return;
    }
    twLine.classList.add('is-typing');
    renderTyped(q, at, ci);
    twTimer = setTimeout(twStep, 18);
  }
}
if (REDUCED){ const f = splitPhrase(PHRASES[0]); renderTyped(f.q, f.a, f.q.length + f.a.length); }
else { twTimer = setTimeout(twStep, 650); }
twLine.addEventListener('click', () => {
  if (REDUCED) return;
  const { q, a: at } = splitPhrase(PHRASES[pi]);
  const total = q.length + at.length;
  if (!del && ci < total){
    clearTimeout(twTimer);
    ci = total;
    renderTyped(q, at, ci);
    twLine.classList.remove('is-typing');
    twTimer = setTimeout(() => { del = true; twStep(); }, 2600);
  }
});

/* ---------- 阅读进度条（页面 / 阅读层双源） ---------- */
const pBar = $('#pBar'), pCursor = $('#pCursor');
let pRaf = null;
function updProgress(){
  pRaf = null;
  let sc = 0, max = 1;
  if (readerOpen){ sc = readerScroll.scrollTop; max = readerScroll.scrollHeight - readerScroll.clientHeight; }
  else { sc = window.scrollY; max = root.scrollHeight - window.innerHeight; }
  const p = max > 0 ? Math.max(0, Math.min(1, sc / max)) : 0;
  pBar.style.transform = `scaleX(${p})`;
  pCursor.style.left = (p * 100) + '%';
  pCursor.style.opacity = p > .004 ? 1 : 0;
}
function reqProgress(){ if (pRaf == null) pRaf = requestAnimationFrame(updProgress); }

/* ---------- Logo 乱码解码效果 ---------- */
const logoTxt = $('#logoTxt');
const SCR = '!<>-_\\/[]{}—=+*^?#';
let scrRun = false;
 $('.logo').addEventListener('mouseenter', () => {
  if (scrRun || REDUCED) return;
  const orig = logoTxt.textContent;
  scrRun = true;
  let f = 0;
  const iv = setInterval(() => {
    f++;
    let out = '', done = 0;
    for (let i = 0; i < orig.length; i++){
      if (orig[i] === ' '){ out += ' '; done++; continue; }
      if (f > i*2 + 6){ out += orig[i]; done++; }
      else out += SCR[(Math.random()*SCR.length)|0];
    }
    logoTxt.textContent = out;
    if (done === orig.length){ clearInterval(iv); logoTxt.textContent = orig; scrRun = false; }
  }, 28);
});

}
