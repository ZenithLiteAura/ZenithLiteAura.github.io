<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ZenithLiteAura · 个人主页</title>
    <meta
      name="description"
      content="ZenithLiteAura 的个人主页 —— MIUIX / HyperOS 风格，中英双语。Personal homepage in MIUIX / HyperOS style."
    />
    <meta name="author" content="ZenithLiteAura" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="ZenithLiteAura" />
    <meta
      property="og:description"
      content="MIUIX / HyperOS 风格的个人主页，中英双语。"
    />
    <meta property="og:image" content="https://zenithliteaura.github.io/avatar.jpg" />
    <meta property="og:url" content="https://zenithliteaura.github.io/" />
    <link rel="canonical" href="https://zenithliteaura.github.io/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/avatar.jpg" />
    <link rel="preload" as="image" href="/avatar.jpg" />
    <script>
      // 在首屏绘制前套用已保存的主题，避免浅/深色闪烁（FOUC）。
      (function () {
        try {
          var pref = localStorage.getItem('zla:theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，忽略即可 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div class="noscript">
        <h1>ZenithLiteAura</h1>
        <p>
          本站需要 JavaScript 才能渲染完整内容。<br />
          This site needs JavaScript to render its full content.
        </p>
        <p><a href="https://github.com/ZenithLiteAura">github.com/ZenithLiteAura</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
